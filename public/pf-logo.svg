<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradiente Azul Pizarra Ejecutivo -->
    <linearGradient id="execSlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A5064" />
      <stop offset="100%" stop-color="#1E2B37" />
    </linearGradient>

    <!-- Gradiente Celeste y Azul Cálido -->
    <linearGradient id="warmSkyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Gradiente Sutil de Borde -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Marco Exterior Achaflanado / Medallón Octogonal Ejecutivo -->
  <polygon 
    points="32,10 168,10 190,32 190,168 168,190 32,190 10,168 10,32" 
    fill="url(#execSlateGrad)" 
    stroke="url(#borderGrad)" 
    stroke-width="2.5" 
  />

  <!-- Marco Interior Fino -->
  <polygon 
    points="37,17 163,17 183,37 183,163 163,183 37,183 17,163 17,37" 
    fill="none" 
    stroke="#7DD3FC" 
    stroke-width="0.8" 
    opacity="0.4"
  />

  <!-- Acentos en las 4 esquinas achaflanadas -->
  <line x1="28" y1="28" x2="38" y2="38" stroke="#38BDF8" stroke-width="1.2" opacity="0.8" />
  <line x1="172" y1="28" x2="162" y2="38" stroke="#38BDF8" stroke-width="1.2" opacity="0.8" />
  <line x1="172" y1="172" x2="162" y2="162" stroke="#38BDF8" stroke-width="1.2" opacity="0.8" />
  <line x1="28" y1="172" x2="38" y2="162" stroke="#38BDF8" stroke-width="1.2" opacity="0.8" />

  <!-- Círculo Guía Orbital de Estandarización y Calidad -->
  <circle cx="100" cy="100" r="54" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.3" />

  <!-- 1. LLAMA SUPERIOR DE COCINA (Alta Producción Gastronómica) -->
  <g fill="url(#warmSkyGrad)" stroke="#38BDF8">
    <path d="M 100,28 C 96,36 93,42 93,48 C 93,54 96,58 100,60 C 104,58 107,54 107,48 C 107,42 104,36 100,28 Z" stroke-width="0.5" />
    <path d="M 100,38 C 98,43 97,46 97,49 C 97,52 98.5,54 100,55 C 101.5,54 103,52 103,49 C 103,46 102,43 100,38 Z" fill="#BAE6FD" stroke="#BAE6FD" stroke-width="0.3" />
  </g>

  <!-- Asa de la Campana Gastronómica (Cloche Ring) -->
  <ellipse cx="100" cy="62" rx="6" ry="3" fill="none" stroke="#38BDF8" stroke-width="1.5" />

  <!-- 2. CAMPANA GASTRONÓMICA / CLOCHE (Hostelería y Cocina) -->
  <path 
    d="M 50,118 C 50,82 72,66 100,66 C 128,66 150,82 150,118 Z" 
    fill="none" 
    stroke="url(#warmSkyGrad)" 
    stroke-width="2" 
    stroke-linecap="round"
  />
  <path 
    d="M 44,120 C 44,118 46,117 50,117 L 150,117 C 154,117 156,118 156,120 L 152,123 L 48,123 Z" 
    fill="#38BDF8" 
    opacity="0.85"
  />

  <!-- 3. SILUETA DE COPA DE BAR & COCTELERÍA -->
  <path 
    d="M 72,126 L 100,154 L 128,126 Z" 
    fill="none" 
    stroke="#38BDF8" 
    stroke-width="1.6" 
    stroke-linejoin="round"
  />
  <line x1="75" y1="129" x2="125" y2="129" stroke="#7DD3FC" stroke-width="1" opacity="0.6" />
  <line x1="100" y1="154" x2="100" y2="172" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  <path d="M 84,172 L 116,172" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />

  <!-- 4. ESTRELLA DE DIRECCIÓN OPERATIVA (Rosa de los Vientos) -->
  <g>
    <line x1="82" y1="82" x2="118" y2="118" stroke="#38BDF8" stroke-width="0.8" opacity="0.5" />
    <line x1="118" y1="82" x2="82" y2="118" stroke="#38BDF8" stroke-width="0.8" opacity="0.5" />

    <!-- Punta Norte -->
    <polygon points="100,74 103,97 100,100" fill="#38BDF8" />
    <polygon points="100,74 97,97 100,100" fill="#0284C7" />
    <!-- Punta Sur -->
    <polygon points="100,126 103,103 100,100" fill="#38BDF8" />
    <polygon points="100,126 97,103 100,100" fill="#0284C7" />
    <!-- Punta Este -->
    <polygon points="126,100 103,97 100,100" fill="#38BDF8" />
    <polygon points="126,100 103,103 100,100" fill="#0284C7" />
    <!-- Punta Oeste -->
    <polygon points="74,100 97,97 100,100" fill="#38BDF8" />
    <polygon points="74,100 97,103 100,100" fill="#0284C7" />

    <!-- Centro joya -->
    <circle cx="100" cy="100" r="3" fill="#BAE6FD" stroke="#1E2B37" stroke-width="0.8" />
  </g>
</svg>
